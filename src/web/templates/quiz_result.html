{% extends "base.html" %}
{% block content %}
<h1 class="page-title">시험 결과</h1>
<p class="page-sub">수고했습니다. 결과는 학습 이력에 저장되어 보고서에 반영됩니다.</p>
<div class="card center">
  <p class="muted" style="margin:0;">점수</p>
  <p class="score">{{ session.score_text }}</p>
  <p class="wrongs">틀린 단어: {{ session.wrong_words|join(', ') if session.wrong_words else '없음' }}</p>
  <div class="actions center">
    <a class="button secondary" href="{{ url_for('home') }}">홈으로</a>
    <form method="post" action="{{ url_for('quiz_retry') }}">
      <button type="submit">다시 시험</button>
    </form>
  </div>
</div>
{% endblock %}
