{% extends "base.html" %}
{% block content %}
<h1 class="page-title">시험</h1>
<p class="page-sub">문제 수, 출제 방향, 문제 유형을 고르고 시작하세요.</p>

{% if quiz_in_progress %}
  <div class="flash info">진행 중인 시험이 있습니다. 새로 시작하면 기존 시험은 사라집니다.</div>
{% endif %}

<form method="post" action="{{ url_for('quiz_start') }}" class="card"
      {% if quiz_in_progress %}onsubmit="return confirm('진행 중인 시험을 버리고 새로 시작할까요?');"{% endif %}>
  <div class="field">
    <label class="title" for="count">문제 수</label>
    <input type="number" id="count" name="count" min="1" max="{{ word_count }}" value="{{ default_count }}" required style="max-width:160px;">
    <span class="hint">1 ~ {{ word_count }}</span>
  </div>
  <div class="field">
    <span class="title">출제 방향</span>
    <div class="options">
      {% for direction in directions %}
        <label class="option"><input type="radio" name="direction" value="{{ direction }}" {% if loop.first %}checked{% endif %}> {{ direction }}</label>
      {% endfor %}
    </div>
  </div>
  <div class="field">
    <span class="title">문제 유형</span>
    <div class="options">
      {% for qtype in types %}
        <label class="option"><input type="checkbox" name="types" value="{{ qtype }}" {% if qtype == '단답형' %}checked{% endif %}> {{ qtype }}</label>
      {% endfor %}
    </div>
  </div>
  <div class="actions">
    <a class="button secondary" href="{{ url_for('home') }}">취소</a>
    <button type="submit">시험 시작</button>
  </div>
</form>
{% endblock %}
