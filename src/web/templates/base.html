<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}스마트 보카{% endblock %}</title>
  <style>
    :root {
      --primary: #3b5bdb;
      --primary-dark: #2f4ac0;
      --primary-soft: #eef2ff;
      --accent: #f59f00;
      --bg: #f4f6fb;
      --surface: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --ok: #16a34a;
      --ok-soft: #e8f8ee;
      --ng: #dc2626;
      --ng-soft: #fdecec;
      --info-soft: #eef4ff;
      --radius: 16px;
      --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 4px 14px rgba(16, 24, 40, .06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* 상단 바 */
    .topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
    .topbar-inner { max-width: 880px; margin: 0 auto; padding: 0 20px; height: 64px; display: flex; align-items: center; gap: 24px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; color: var(--text); text-decoration: none; white-space: nowrap; }
    .brand-mark { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, var(--primary), #7c8cf0); color: #fff; display: grid; place-items: center; font-size: 16px; }
    .nav { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
    .nav a { color: var(--muted); text-decoration: none; padding: 8px 12px; border-radius: 10px; font-weight: 600; font-size: 15px; }
    .nav a:hover { background: var(--bg); color: var(--text); }
    .nav a.active { background: var(--primary-soft); color: var(--primary); }
    .nav a.settings { margin-left: auto; }

    /* 본문 */
    main { max-width: 880px; margin: 28px auto 60px; padding: 0 20px; }
    .page-title { font-size: 24px; font-weight: 800; margin: 0 0 6px; }
    .page-sub { color: var(--muted); margin: 0 0 22px; font-size: 14px; }

    /* 카드 */
    .card { background: var(--surface); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); margin-bottom: 18px; border: 1px solid var(--line); }
    .card h2, .card h3 { margin: 0 0 12px; font-weight: 800; }
    .hero { background: linear-gradient(135deg, var(--primary) 0%, #6d83f2 100%); color: #fff; border: 0; }
    .hero .eyebrow { opacity: .85; font-size: 14px; font-weight: 600; margin: 0 0 6px; }
    .hero .day { font-size: 34px; font-weight: 800; margin: 0 0 4px; }
    .hero .range { font-size: 16px; opacity: .92; margin: 0 0 22px; }
    .hero .muted-light { opacity: .8; font-size: 14px; margin-top: 16px; }
    .hero .button { background: #fff; color: var(--primary); }
    .hero .button:hover { background: var(--primary-soft); }
    .hero .button.ghost { background: rgba(255,255,255,.16); color: #fff; }
    .hero .button.ghost:hover { background: rgba(255,255,255,.26); }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
    .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
    .stat .label { color: var(--muted); font-size: 13px; font-weight: 600; }
    .stat .value { font-size: 22px; font-weight: 800; margin-top: 4px; }

    /* 알림 */
    .flash { padding: 12px 16px; border-radius: 12px; margin-bottom: 14px; font-weight: 600; font-size: 15px; border: 1px solid transparent; }
    .flash.error { background: var(--ng-soft); color: var(--ng); border-color: #f8c9c9; }
    .flash.success { background: var(--ok-soft); color: var(--ok); border-color: #bfe8cd; }
    .flash.info { background: var(--info-soft); color: var(--primary-dark); border-color: #d6e0ff; }

    /* 버튼 */
    button, .button {
      font: inherit; font-weight: 700; font-size: 15px;
      background: var(--primary); color: #fff; border: 0; border-radius: 12px;
      padding: 11px 20px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      transition: background .15s, transform .05s;
    }
    button:hover, .button:hover { background: var(--primary-dark); }
    button:active, .button:active { transform: translateY(1px); }
    button.secondary, .button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
    button.secondary:hover, .button.secondary:hover { background: var(--bg); }
    button.danger { background: transparent; color: var(--ng); }
    button.danger:hover { background: var(--ng-soft); }
    button:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; border: 0; }
    button.secondary:disabled { background: #f3f4f6; color: #9ca3af; border: 1px solid var(--line); }

    /* 입력 */
    input[type=text], input[type=number], select {
      font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--text);
    }
    input[type=text]:focus, input[type=number]:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
    input[type=text].answer { width: 100%; font-size: 20px; padding: 14px 16px; text-align: center; }
    input[type=radio], input[type=checkbox] { accent-color: var(--primary); width: 16px; height: 16px; }
    .field { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .field:last-child { border-bottom: 0; }
    .field > label.title { font-weight: 700; }
    .field .hint { color: var(--muted); font-size: 13px; }
    .options { display: flex; gap: 8px; flex-wrap: wrap; }
    .option { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; background: #fff; }
    .option:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
    .option input { margin: 0; }

    /* 진행 막대 */
    .progress { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 12px 0 22px; }
    .progress > span { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), #7c8cf0); border-radius: 999px; }
    .head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-size: 13px; font-weight: 700; }
    .pill.review { background: #fff4df; color: #b45309; }

    /* 암기 카드 */
    .flashcard { min-height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; border-radius: 20px; background: linear-gradient(180deg, #ffffff 0%, #f8faff 100%); border: 1px solid var(--line); margin-bottom: 22px; }
    .big { font-size: 46px; font-weight: 800; letter-spacing: -.5px; margin: 0; word-break: break-word; }
    .meaning { font-size: 22px; font-weight: 600; color: var(--primary); margin-top: 16px; min-height: 34px; }
    .meaning.hidden { color: #d1d5db; }

    /* 시험 */
    .prompt { font-size: 30px; font-weight: 800; text-align: center; margin: 18px 0 26px; word-break: break-word; }
    .choice { display: flex; width: 100%; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; cursor: pointer; font-size: 17px; font-weight: 600; background: #fff; color: var(--text); text-align: left; }
    .choice:hover { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
    .choice .num { width: 28px; height: 28px; border-radius: 8px; background: var(--bg); display: grid; place-items: center; font-size: 14px; color: var(--muted); flex: 0 0 auto; }
    .ox { display: flex; gap: 14px; justify-content: center; }
    .ox button { width: 120px; height: 84px; font-size: 34px; border-radius: 18px; }
    .ox button.secondary { color: var(--ng); }
    .feedback { border-radius: 12px; padding: 14px 16px; font-weight: 700; font-size: 16px; margin: 6px 0 4px; }
    .feedback.ok { background: var(--ok-soft); color: var(--ok); }
    .feedback.ng { background: var(--ng-soft); color: var(--ng); }
    .score { font-size: 40px; font-weight: 800; color: var(--primary); margin: 8px 0 14px; }
    .wrongs { color: var(--muted); }
    .actions { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 22px; }
    .actions.center { justify-content: center; }
    .actions.left { justify-content: flex-start; margin-top: 0; }
    .leave { text-align: center; margin-top: 10px; }

    /* 표 */
    table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 15px; }
    th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--line); }
    th { background: var(--bg); color: var(--muted); font-size: 13px; font-weight: 700; position: sticky; top: 64px; }
    th:first-child, td:first-child { border-top-left-radius: 0; }
    tbody tr:hover td { background: #fafbff; }
    td.num { color: var(--muted); width: 70px; }
    td.en { font-weight: 700; }
    td.pos { color: var(--muted); }
    .search { display: flex; gap: 10px; margin-bottom: 14px; }
    .search input { flex: 1; }

    /* 보고서 */
    pre { background: #f8fafc; border: 1px solid var(--line); padding: 18px; border-radius: 12px; white-space: pre-wrap; font-family: "Consolas", "D2Coding", monospace; font-size: 14px; line-height: 1.7; }
    .path { color: var(--muted); font-size: 13px; word-break: break-all; }

    .muted { color: var(--muted); font-size: 14px; }
    .center { text-align: center; }
    .empty { text-align: center; padding: 36px 12px; color: var(--muted); }

    @media (max-width: 640px) {
      .topbar-inner { height: auto; padding: 12px 16px; flex-wrap: wrap; gap: 10px; }
      .nav a { padding: 7px 9px; font-size: 14px; }
      .stats { grid-template-columns: 1fr; }
      .big { font-size: 36px; }
      .prompt { font-size: 24px; }
      .ox button { width: 100px; }
    }
  </style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">V</span>스마트 보카</a>
    <nav class="nav">
      <a href="{{ url_for('home') }}" class="{{ 'active' if request.endpoint == 'home' }}">홈</a>
      <a href="{{ url_for('memorize_page') }}" class="{{ 'active' if request.endpoint in ('memorize_page',) }}">암기</a>
      <a href="{{ url_for('quiz_setup_page') }}" class="{{ 'active' if request.endpoint in ('quiz_setup_page', 'quiz_page') }}">시험</a>
      <a href="{{ url_for('words_page') }}" class="{{ 'active' if request.endpoint == 'words_page' }}">단어장</a>
      <a href="{{ url_for('report_page') }}" class="{{ 'active' if request.endpoint in ('report_page', 'report_create') }}">보고서</a>
      <a href="{{ url_for('settings_page') }}" class="settings {{ 'active' if request.endpoint == 'settings_page' }}">설정 ⚙</a>
    </nav>
  </div>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
